app_name = "obelisk-version-monitor"

[secrets]
MONITOR_GITHUB_TOKEN = {}
OBELISK_API_TOKEN = {}

[public_env]
OBELISK_API_URL = { optional = true }
WEBUI_BASE = { optional = true }

[[outbound_http.allowed_host]]
pattern = "https://raw.githubusercontent.com"
methods = ["GET"]
secrets = ["MONITOR_GITHUB_TOKEN"]
replace_in = ["headers"]

[[outbound_http.allowed_host]]
pattern = "${OBELISK_API_URL:-http://127.0.0.1:5005}"
methods = ["GET", "PUT"]
secrets = ["OBELISK_API_TOKEN"]
replace_in = ["headers"]

[[outbound_http.allowed_host]]
pattern = "https://api.github.com"
methods = ["GET", "POST", "PUT"]
secrets = ["MONITOR_GITHUB_TOKEN"]
replace_in = ["headers"]
