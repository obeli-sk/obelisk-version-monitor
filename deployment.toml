# obelisk-version-monitor — periodic workflow that records the `obelisk`
# version pinned in `dev-deps.txt` of every public obeli-sk repo, plus a
# webhook that displays the latest result.

[[activity_js]]
name = "list_repos"
location = "activity/list_repos.js"
ffqn = "obeli-sk:version-monitor/repos.list-repos"
return_type = "result<list<string>, string>"
exec.lock_expiry.seconds = 30
[[activity_js.allowed_host]]
url_prefix = "https://api.github.com/orgs/obeli-sk/repos"
methods = ["GET"]
url_regex_suffix = "$"
secrets = ["MONITOR_GITHUB_TOKEN"]
replace_in = ["headers"]

[[activity_js]]
name = "fetch_dev_deps"
location = "activity/fetch_dev_deps.js"
ffqn = "obeli-sk:version-monitor/repos.fetch-dev-deps"
params = [
  { name = "repo", type = "string" },
]
return_type = "result<string, variant { permanent-not-found, transient-error(string), execution-failed }>"
exec.lock_expiry.seconds = 30
[[activity_js.allowed_host]]
url_prefix = "https://raw.githubusercontent.com/obeli-sk"
methods = ["GET"]
url_regex_suffix = "/[^/]+/(main|master)/dev-deps\\.txt$"
secrets = ["MONITOR_GITHUB_TOKEN"]
replace_in = ["headers"]

[[activity_js]]
name = "fetch_pull_requests"
location = "activity/fetch_pull_requests.js"
ffqn = "obeli-sk:version-monitor/repos.fetch-pull-requests"
params = [
  { name = "repos", type = "list<string>" },
]
return_type = "result<string, string>"
exec.lock_expiry.seconds = 30
[[activity_js.allowed_host]]
url_prefix = "https://api.github.com/search/issues"
methods = ["GET"]
url_regex_suffix = "$"
secrets = ["MONITOR_GITHUB_TOKEN"]
replace_in = ["headers"]
[[activity_js.allowed_host]]
url_prefix = "https://api.github.com/repos/obeli-sk"
methods = ["GET"]
url_regex_suffix = "/[^/]+/(pulls/[0-9]+|commits/[^/]+/check-runs)$"
secrets = ["MONITOR_GITHUB_TOKEN"]
replace_in = ["headers"]

[[activity_js]]
name = "fetch_gh_actions"
location = "activity/fetch_gh_actions.js"
ffqn = "obeli-sk:version-monitor/github.fetch-gh-actions"
params = [
  { name = "repos", type = "list<string>" },
]
return_type = "result<string, string>"
exec.lock_expiry.seconds = 30
[[activity_js.allowed_host]]
url_prefix = "https://api.github.com/repos/obeli-sk"
methods = ["GET"]
url_regex_suffix = "/[^/]+/actions/workflows/sync-flake-lock\\.yml/runs$"
secrets = ["MONITOR_GITHUB_TOKEN"]
replace_in = ["headers"]

[[activity_js]]
name = "run_sync_flake_lock"
location = "activity/run_sync_flake_lock.js"
ffqn = "obeli-sk:version-monitor/github.run-sync-flake-lock"
params = [
  { name = "repo", type = "string" },
]
return_type = "result<string, string>"
exec.lock_expiry.seconds = 30
[[activity_js.allowed_host]]
url_prefix = "https://api.github.com/repos/obeli-sk"
methods = ["GET"]
url_regex_suffix = "/[^/]+$"
secrets = ["MONITOR_GITHUB_TOKEN"]
replace_in = ["headers"]
[[activity_js.allowed_host]]
url_prefix = "https://api.github.com/repos/obeli-sk"
methods = ["POST"]
url_regex_suffix = "/[^/]+/actions/workflows/sync-flake-lock\\.yml/dispatches$"
secrets = ["MONITOR_GITHUB_TOKEN"]
replace_in = ["headers"]

[[activity_js]]
name = "merge_pull_request"
location = "activity/merge_pull_request.js"
ffqn = "obeli-sk:version-monitor/github.merge-pull-request"
params = [
  { name = "repo", type = "string" },
  { name = "number", type = "u64" },
  { name = "head-sha", type = "string" },
]
return_type = "result<string, string>"
exec.lock_expiry.seconds = 30
[[activity_js.allowed_host]]
url_prefix = "https://api.github.com/repos/obeli-sk"
methods = ["PUT"]
url_regex_suffix = "/[^/]+/pulls/[0-9]+/merge$"
secrets = ["MONITOR_GITHUB_TOKEN"]
replace_in = ["headers"]

[[activity_js]]
name = "retire_repo_monitors"
location = "activity/retire_repo_monitors.js"
ffqn = "obeli-sk:version-monitor/repos.retire-repo-monitors"
return_type = "result<u32, string>"
exec.lock_expiry.seconds = 30
env_vars = ["OBELISK_API_URL"]
[[activity_js.allowed_host]]
url_prefix = "${OBELISK_API_URL}"
methods = ["GET"]
url_regex_suffix = "/v1/executions$"
secrets = ["OBELISK_API_TOKEN"]
replace_in = ["headers"]
[[activity_js.allowed_host]]
url_prefix = "${OBELISK_API_URL}"
methods = ["PUT"]
url_regex_suffix = "/v1/executions/[^/]+/(cancel|pause)$"
secrets = ["OBELISK_API_TOKEN"]
replace_in = ["headers"]

[[workflow_js]]
name = "monitor"
location = "workflow/monitor.js"
ffqn = "obeli-sk:version-monitor/monitor.run"
return_type = "result<list<record { repo: string, version: string, pull-requests: list<record { number: u64, html-url: string, state: string, checks-state: option<string>, head-sha: option<string> }>, gh-action: option<record { html-url: string, status: string }> }>, string>"

[[workflow_js]]
name = "bump"
location = "workflow/bump.js"
ffqn = "obeli-sk:version-monitor/bump.run"
params = [
  { name = "repos", type = "list<string>" },
]
return_type = "result<list<record { repo: string, result: string }>, string>"

[[webhook_endpoint_js]]
name = "show"
location = "webhook/show.js"
routes = [
  { methods = ["GET"], route = "/" },
  { methods = ["GET"], route = "/api/status" },
  { methods = ["GET"], route = "/refresh" },
  { methods = ["POST"], route = "/bump" },
  { methods = ["GET"], route = "/merge/:repo/:number" },
]
env_vars = ["OBELISK_API_URL", "OBELISK_WEBUI_URL"]
[[webhook_endpoint_js.allowed_host]]
url_prefix = "${OBELISK_API_URL}"
methods = ["GET"]
url_regex_suffix = "/v1/executions(/[^/]+)?$"
secrets = ["OBELISK_API_TOKEN"]
replace_in = ["headers"]
[[webhook_endpoint_js.allowed_host]]
url_prefix = "https://api.github.com/repos/obeli-sk"
methods = ["GET"]
url_regex_suffix = "/[^/]+/(pulls/[0-9]+|commits/[^/]+/check-runs)$"
secrets = ["MONITOR_GITHUB_TOKEN"]
replace_in = ["headers"]

[[cron]]
name = "monitor_run"
ffqn = "obeli-sk:version-monitor/monitor.run"
schedule = "*/5 * * * *" # every five minutes
overlap = "skip"
